name: portfolio360_semantic_model
description: This semantic data model contains comprehensive information about pharmaceutical  research
  and development projects, including their therapeutic indications, team members,
  and value propositions.  It allows analysis of medical coding mappings between different
  classification systems (like MedDRA and  ICD-10), project characteristics, therapeutic
  profiles, and team compositions. You can analyze project  statuses, therapeutic
  areas, mechanisms of action, and value assessments across different stakeholder  perspectives.
  The data enables tracking of project phases, priorities, and approved positions
  across  clinical development stages. You can also examine competitive positioning,
  patient populations of interest,  and value propositions for patients, payers, and
  prescribers
tables:
- name: vw_meddra_icd10_mapping
  base_table:
    database: RNDCONTROLLING
    schema: DP_RDPORTFOLIO360
    table: VW_MEDDRA_ICD10_MAPPING
  dimensions:
  - name: icd10_code_2019_intl_core_ver
    expr: ICD10_CODE_2019_INTL_CORE_VER
    data_type: text
  - name: sanofi_meddra_indication_code
    expr: SANOFI_MEDDRA_INDICATION_CODE
    data_type: text
  measures:
  - name: sum_meddra_pt_code
    expr: SUM(MEDDRA_PT_CODE)
    data_type: number
  - name: sum_meddra_llt_code
    expr: SUM(MEDDRA_LLT_CODE)
    data_type: number
